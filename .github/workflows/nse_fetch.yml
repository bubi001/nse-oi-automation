name: Daily NSE Participant Data Fetcher

on:
  schedule:
    # Runs Monday to Friday at 13:45 UTC (7:15 PM IST)
    - cron: '45 13 * * 1-5'
  workflow_dispatch: # Keeps manual execution button active

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Load code into runner virtual machine
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Install secure and clean Python runtime
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Step 3: Explicitly upgrade pip and force install processing dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests openpyxl

    # Step 4: Run download handler script
    - name: Run Data Fetcher Script
      run: python script.py

    # Step 5: Securely upload changes using administrative permissions
    - name: Commit and Push Updated Data
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add historical_participant_oi.csv || true
        git commit -m "Automated update: $(date +'%Y-%m-%d')" || exit 0
        git push
